# Conda spec for the Coiled `esip-notebook` software environment, mirroring the
# `esip2026` micromamba env built in notebook.sky.yaml.
#   coiled env create --name esip-notebook --conda environment.yml
name: esip-notebook
channels:
  - conda-forge
dependencies:
  - python=3.12
  - jupyterlab
  - ipywidgets
  - ipympl
  - icechunk
  - virtualizarr
  - zarr
  - xarray
  - dask
  - distributed
  - arraylake
  - obstore
  - s3fs
  - fsspec
  - h5netcdf
  - h5py
  - cftime
  - nc-time-axis
  - cf_xarray
  - rioxarray
  - rasterio
  - gdal
  - pyproj
  - cartopy
  - geopandas
  - shapely
  - geoviews
  - datashader
  - holoviews
  - hvplot
  - panel
  - bokeh
  - pandas
  - numpy
  - matplotlib
  - xugrid
  - rustac
  - git
  - pip
  - pip:
      - gribberish[virtualizarr]
      - virtual_tiff
      - xpystac @ git+https://github.com/stac-utils/xpystac.git@main
