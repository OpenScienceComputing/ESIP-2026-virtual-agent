# SkyPilot task: launch a JupyterLab VM on AWS for the ESIP 2026 breakout,
# with Claude Code (via AWS Bedrock) already installed and configured.
#
#   export AWS_ACCESS_KEY_ID=<shared key id, announced at the event>
#   export AWS_SECRET_ACCESS_KEY=<shared secret key, announced at the event>
#   export JUPYTER_TOKEN=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
#   sky launch -c <your-name>-esip2026 notebook.sky.yaml --infra aws/us-east-1 \
#     --env AWS_ACCESS_KEY_ID --env AWS_SECRET_ACCESS_KEY --env JUPYTER_TOKEN -y -d
#
# --env AWS_ACCESS_KEY_ID (no =value) passes through your already-exported
# local value - the same credentials authenticate SkyPilot itself, so you
# only type them once. setup_claude_agent.sh (run automatically below) uses
# them to configure Claude Code/Bedrock/S3 on the VM - no separate step.
#
# --infra pins the region - always pass it explicitly (compute close to
# your data), don't rely on SkyPilot's default of "wherever has capacity".
#
# -d (--detach-run) is required: without it, `sky launch` waits for the run
# command to finish, which never happens for a long-running server like
# JupyterLab - it would just hang your terminal instead of returning control.
#
# Then, once it's up, tunnel to it over SSH (no public port exposed, no
# cleartext token on the open internet) and open it in your browser. Local
# side is 8889, not 8888, so this doesn't collide with a JupyterLab you may
# already have running locally on the default port - the remote side stays
# 8888, matching the `jupyter lab --port=8888` below:
#   ssh -f -N -L 8889:localhost:8888 <your-name>-esip2026
#   echo "http://localhost:8889/lab?token=$JUPYTER_TOKEN"

name: esip2026-notebook

# Syncs this repo to ~/sky_workdir on the VM - no separate git clone needed
# once you're on the VM, and CLAUDE.md/.claude/skills/examples all just work.
workdir: .

resources:
  infra: aws
  cpus: 4
  disk_size: 50
  # No `ports:` - JupyterLab is reached only via SSH tunnel (see header),
  # not exposed on a public port. Keeps the token off the open internet.
  autostop:
    idle_minutes: 30
    down: true
    wait_for: jobs_and_ssh

envs:
  JUPYTER_TOKEN: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

setup: |
  "${SHELL}" <(curl -L https://micro.mamba.pm/install.sh) < /dev/null
  export PATH="$HOME/.local/bin:$PATH"
  micromamba create -y -n esip2026 -c conda-forge \
    python=3.12 jupyterlab ipywidgets ipympl \
    icechunk virtualizarr zarr xarray dask distributed \
    arraylake obstore s3fs fsspec h5netcdf h5py cftime nc-time-axis cf_xarray \
    rioxarray rasterio gdal pyproj cartopy geopandas shapely \
    geoviews datashader holoviews panel bokeh \
    pandas numpy matplotlib xugrid
  micromamba run -n esip2026 pip install --quiet "gribberish[virtualizarr]" virtual_tiff

  # Pin hvplot to a pyviz dev-channel prerelease rather than the conda-forge
  # release - installed separately (not in the main create above) so this
  # one package's channel doesn't affect resolution of everything else.
  micromamba install -y -n esip2026 -c pyviz/label/dev hvplot=0.13.0a1

  # Antigravity CLI (agy) - a fallback agent in case Claude Code/Bedrock is
  # overloaded or unavailable during the event. Google retired free/Pro/Ultra
  # OAuth login for the older Gemini CLI on 2026-06-18 in favor of this tool,
  # so it's the current supported path for attendees using a personal Google
  # account. Native installer (no Node.js needed) - puts `agy` in
  # ~/.local/bin, already on PATH (see the export above and
  # setup_claude_agent.sh's PATH wiring below). Needs no AWS creds, so this
  # runs unconditionally, unlike the Claude Code setup below. Auth is a
  # per-attendee interactive step (personal Google login, free tier - prints
  # a URL to open locally and a code to paste back, works fine from both a
  # raw SSH session and a JupyterLab terminal) - see README.md.
  curl -fsSL https://antigravity.google/cli/install.sh | bash

  # Auto-approve the tool categories this workshop's workflow needs (shell
  # commands - which covers Python invocations too - and web search/fetch),
  # matching the trust level .claude/settings.json already grants Claude Code
  # in this repo. Global, not project-level - agy has no documented
  # project-level settings.json equivalent to .claude/settings.json.
  mkdir -p ~/.gemini/antigravity-cli
  printf '%s\n' '{"permissions": {"allow": ["command(*)", "read_url(*)", "execute_url(*)"]}}' > ~/.gemini/antigravity-cli/settings.json

  if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
    bash ~/sky_workdir/setup_claude_agent.sh
  else
    echo "AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY not passed via --env - skipping Claude Code setup." >&2
    echo "Run 'bash setup_claude_agent.sh' by hand after SSHing in instead." >&2
  fi

run: |
  if [ -z "$JUPYTER_TOKEN" ]; then
    echo "ERROR: JUPYTER_TOKEN is not set. Launch with --env JUPYTER_TOKEN (see the header of this file)." >&2
    exit 1
  fi
  export PATH="$HOME/.local/bin:$PATH"
  eval "$(micromamba shell hook --shell bash)"
  micromamba activate esip2026
  cd ~/sky_workdir
  jupyter lab --no-browser --ip=127.0.0.1 --port=8888 --IdentityProvider.token="$JUPYTER_TOKEN"
